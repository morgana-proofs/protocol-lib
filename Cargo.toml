[package]
name = "protocol-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ec = { version = "^0.5.0", features = ["parallel"]}
ark-ff = { version = "^0.5.0", features = ["parallel", "asm"] }
ark-std = { version = "^0.5.0", features = ["parallel"] }
ark-serialize = { version = "^0.5.0", default-features = false, features = ["derive"] }
ark-bn254 = { version = "^0.5.0", default-features = false, features = ["curve"] }

rand = {version = "^ 0.9.0"}

rayon = {version = "^1.10.0"}
itertools = {version = "^0.14.0"}
merlin = {version = "3.0.0"}
num-traits = {version = "0.2.19"}
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-span-tree = "0.1.1"
serde = { version = "1.0.219", features = ["derive"] }
criterion = "0.5.1"

[profile.rel-with-debinfo]
inherits = "release"
debug = true

[features]
parallel = []
testbench = []
default = [
#    "parallel"
]

[[bench]]
name = "sqrt_vspark"
harness = false